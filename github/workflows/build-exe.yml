name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          architecture: x64

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build BookMart.exe
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "BookMart" --add-data "templates;templates" --add-data "static;static" --collect-all webview app.py

      - uses: actions/upload-artifact@v4
        with:
          name: BookMart-windows
          path: dist/BookMart.exe
          if-no-files-found: error

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BookMart.exe
